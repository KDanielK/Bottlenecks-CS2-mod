  <rect x="92" y="72" width="72" height="40" rx="8" fill="#f29d1f"/>
  <circle cx="102" cy="142" r="10" fill="#f29d1f"/>
  <circle cx="154" cy="142" r="10" fill="#f29d1f"/>
  <path d="M96 174 L76 204 M160 174 L180 204" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
  <!-- Pause bars: the train is held -->
